# Must match Cargo.toml's rust-version. Clippy uses it to suppress advice that suggests APIs
# newer than the MSRV, which would be unfixable.
msrv = "1.99"

# Identifiers doc_markdown would otherwise want backticked: product names, acronyms, CamelCase.
# ".." keeps clippy's own defaults.
doc-valid-idents = [".."]
