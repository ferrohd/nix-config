[package]
name = "app"
description = "A library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]

# docs.rs builds with every feature on. `just doc` passes `--cfg docsrs` to match, so a
# `#[cfg(docsrs)]` attribute behaves the same locally as it will on the registry.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
