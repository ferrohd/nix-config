name: Update apple-color-emoji

# Checks the upstream samuelngs/apple-emoji-ttf repo monthly for a new
# release. If one is available, bumps the URL, SRI hash, and version in
# pkgs/apple-color-emoji/default.nix, verifies it builds, and opens a PR.

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Bump apple-color-emoji
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check upstream release and update package
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PKG_FILE="pkgs/apple-color-emoji/default.nix"

          # ── Fetch latest upstream release info ────────────────────────────
          RELEASE_JSON=$(gh api repos/samuelngs/apple-emoji-ttf/releases/latest)
          LATEST_TAG=$(jq -r '.tag_name' <<<"$RELEASE_JSON")
          ASSET_URL=$(jq -r '.assets[]
            | select(.name == "AppleColorEmoji-Linux.ttf")
            | .browser_download_url' <<<"$RELEASE_JSON")

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "::error::AppleColorEmoji-Linux.ttf asset not present in release $LATEST_TAG"
            exit 1
          fi

          # ── Compare with current pinned URL ──────────────────────────────
          CURRENT_URL=$(grep -oP 'url = "\K[^"]+' "$PKG_FILE")

          if [ "$ASSET_URL" = "$CURRENT_URL" ]; then
            echo "Already on $LATEST_TAG; nothing to do."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::New release detected: $LATEST_TAG"
          echo "  old URL: $CURRENT_URL"
          echo "  new URL: $ASSET_URL"

          # ── Compute SRI hash for the new asset ───────────────────────────
          NEW_HASH_B32=$(nix-prefetch-url --type sha256 "$ASSET_URL")
          NEW_HASH_SRI=$(nix hash convert --hash-algo sha256 --to sri "$NEW_HASH_B32")

          # Strip the trailing -<commit-hash> suffix from the tag to get the
          # canonical version string used in the package (e.g. macos-26-20260219).
          NEW_VERSION=$(sed -E 's/-[0-9a-f]{6,}$//' <<<"$LATEST_TAG")

          # ── Patch the package file in place ──────────────────────────────
          # Use '|' as sed delimiter since URLs contain '/'.
          sed -i -E "s|url = \"[^\"]+\";|url = \"$ASSET_URL\";|"           "$PKG_FILE"
          sed -i -E "s|hash = \"sha256-[^\"]+\";|hash = \"$NEW_HASH_SRI\";|" "$PKG_FILE"
          sed -i -E "s|version = \"[^\"]+\";|version = \"$NEW_VERSION\";|"   "$PKG_FILE"

          {
            echo "updated=true"
            echo "tag=$LATEST_TAG"
            echo "version=$NEW_VERSION"
            echo "previous_url=$CURRENT_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the bump builds
        if: steps.check.outputs.updated == 'true'
        run: |
          set -euo pipefail
          # Flakes only see git-tracked files. Stage the modified file so
          # `nix flake check` and `nix build` can read it.
          git add pkgs/apple-color-emoji/default.nix
          nix flake check --no-build
          nix build .#nixosConfigurations.blackmesa.pkgs.apple-color-emoji --no-link --print-out-paths

      - name: Open pull request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "pkgs/apple-color-emoji: bump to ${{ steps.check.outputs.tag }}"
          branch: bot/apple-color-emoji
          delete-branch: true
          title: "pkgs/apple-color-emoji: bump to ${{ steps.check.outputs.version }}"
          body: |
            Automated bump of `apple-color-emoji` to upstream release [`${{ steps.check.outputs.tag }}`](https://github.com/samuelngs/apple-emoji-ttf/releases/tag/${{ steps.check.outputs.tag }}).

            **Changes**
            - `url`, `hash`, and `version` updated in `pkgs/apple-color-emoji/default.nix`.

            **CI verified**
            - `nix flake check --no-build`
            - `nix build .#nixosConfigurations.blackmesa.pkgs.apple-color-emoji`

            ---
            *Generated by `.github/workflows/update-apple-emoji.yml`. Re-run anytime via the Actions tab → `Update apple-color-emoji` → `Run workflow`.*
          labels: |
            dependencies
            automated
